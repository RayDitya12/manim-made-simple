<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manim Made Simple</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="masthead">
      <h1 id="app-name"></h1>
      <p class="tagline" data-i18n="app.tagline"></p>
    </header>

    <main class="layout">
      <section class="pane pane--settings" aria-labelledby="settings-heading">
        <h2 id="settings-heading" data-i18n="settings.heading"></h2>

        <p id="job-status" class="status" role="status"></p>

        <form id="settings" method="post" action="/api/render" hidden>
          <div id="fields" class="fields"></div>

          <div class="actions">
            <button
              id="generate"
              type="submit"
              data-i18n="action.generate"
            ></button>
            <button
              id="download-hd"
              class="secondary"
              type="button"
              data-i18n="action.download_hd"
            ></button>
            <button
              id="cancel"
              type="button"
              data-i18n="action.cancel"
              hidden
            ></button>
            <progress
              id="busy"
              class="busy"
              aria-labelledby="job-status"
              hidden
            ></progress>
          </div>

          <div id="job-error" class="callout" role="alert" hidden>
            <!-- Decorative: the sentence beside it says what happened. -->
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7.5v5.5M12 16.5h.01" />
            </svg>
            <p id="job-error-text"></p>
            <button
              id="retry"
              type="button"
              data-i18n="action.retry"
              hidden
            ></button>
          </div>
        </form>
      </section>

      <section class="pane pane--output" aria-labelledby="output-heading">
        <h2 id="output-heading" data-i18n="output.heading"></h2>
        <!-- The slate the video is drawn on: the background and text color that were picked,
             at the shape the chosen quality produces. Decorative, because `app.js` fills it
             with the user's own text and `aria-hidden` keeps that out of the reading order. -->
        <div class="frame" id="preview-frame" aria-hidden="true">
          <p class="frame-text" id="preview-frame-text"></p>
        </div>
        <p class="frame-meta" id="preview-meta"></p>
        <!-- The accessible name is the visible heading of this pane. -->
        <video
          id="player"
          controls
          aria-labelledby="output-heading"
          width="854"
          height="480"
          hidden
        ></video>
      </section>
    </main>
  </body>
</html>
